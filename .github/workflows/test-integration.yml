name: ADK Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-adk:
    name: Test ADK Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build ADK
        working-directory: installer
        run: make build

      - name: Test source, installer wrapper, and benchmark CLI
        working-directory: installer
        run: make test

      - name: Validate benchmark examples and dogfood suite
        working-directory: installer
        run: make test-bench-examples

      - name: Test global installation
        working-directory: installer
        run: |
          mkdir -p test-home
          HOME="$(pwd)/test-home" ./dist/smaqit-adk-dev --install-global

      - name: Validate global ADK structure
        working-directory: installer
        run: |
          HOME="$(pwd)/test-home"

          # Level agents — Claude Code and Codex CLI, never Copilot
          test -f "$HOME/.claude/agents/smaqit-L0.md" || (echo "Error: smaqit-L0.md not found" && exit 1)
          test -f "$HOME/.claude/agents/smaqit-L1.md" || (echo "Error: smaqit-L1.md not found" && exit 1)
          test -f "$HOME/.claude/agents/smaqit-L2.md" || (echo "Error: smaqit-L2.md not found" && exit 1)
          test -f "$HOME/.codex/agents/smaqit.L0.toml" || (echo "Error: smaqit.L0.toml not found" && exit 1)
          test -f "$HOME/.codex/agents/smaqit.L1.toml" || (echo "Error: smaqit.L1.toml not found" && exit 1)
          test -f "$HOME/.codex/agents/smaqit.L2.toml" || (echo "Error: smaqit.L2.toml not found" && exit 1)
          test ! -d "$HOME/.copilot/agents" || (echo "Error: no Copilot agent directory should be created" && exit 1)

          # All 5 skills, in both the shared (Copilot+Codex) and Claude paths
          for skill in smaqit.create-agent smaqit.create-skill smaqit.new-principle smaqit.bench-run smaqit.bench-scaffold; do
            test -f "$HOME/.agents/skills/$skill/SKILL.md" || (echo "Error: .agents/skills/$skill/SKILL.md not found" && exit 1)
            test -f "$HOME/.claude/skills/$skill/SKILL.md" || (echo "Error: .claude/skills/$skill/SKILL.md not found" && exit 1)
          done

          # Framework and templates, namespaced under smaqit-adk's own global data dir
          test -d "$HOME/.agents/smaqit-adk/framework" || (echo "Error: .agents/smaqit-adk/framework/ not found" && exit 1)
          test -f "$HOME/.agents/smaqit-adk/framework/AGENTS.md" || (echo "Error: AGENTS.md not found in framework" && exit 1)
          test -d "$HOME/.agents/smaqit-adk/templates" || (echo "Error: .agents/smaqit-adk/templates/ not found" && exit 1)
          test -f "$HOME/.agents/smaqit-adk/templates/agents/base-agent.template.md" || (echo "Error: base-agent.template.md not found" && exit 1)

          echo "✓ All global ADK files validated"

      - name: Verify no project-directory installation
        run: |
          mkdir -p test-project && cd test-project
          test ! -d .github/agents || (echo "Error: .github/agents/ should never be created" && exit 1)
          test ! -d .github/skills || (echo "Error: .github/skills/ should never be created" && exit 1)
          test ! -d .claude/agents || (echo "Error: .claude/agents/ should not be created by global install" && exit 1)
          test ! -d .smaqit/framework || (echo "Error: .smaqit/framework/ should not be created by global install" && exit 1)
          echo "✓ No project-directory artifacts created"

      - name: Verify global uninstall
        working-directory: installer
        run: |
          HOME="$(pwd)/test-home"
          echo "y" | HOME="$HOME" ./dist/smaqit-adk-dev uninstall
          test ! -f "$HOME/.claude/agents/smaqit-L2.md" || (echo "Error: smaqit-L2.md should be removed after uninstall" && exit 1)
          test ! -d "$HOME/.agents/smaqit-adk" || (echo "Error: .agents/smaqit-adk/ should be removed after uninstall" && exit 1)
          # Shared parent directories must survive uninstall
          test -d "$HOME/.agents/skills" || (echo "Error: shared .agents/skills/ directory should survive uninstall" && exit 1)
          echo "✓ Global uninstall verified"
