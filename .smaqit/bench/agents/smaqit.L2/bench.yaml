schemaVersion: 2
name: smaqit-l2
# Dogfood suite for agents/smaqit.L2.md. See ../../MIGRATION.md for how
# this maps from the legacy tests/evals/agents/smaqit.L2/*.json cases, and
# ../../README.md for the with/without-artifact and reusable-Codex-block
# conventions this manifest follows.
cases:
  - id: compile-base-agent
    given:
      prompt:
        file: prompts/compile-base-agent.md
      files:
        - id: l2agent
          source: ../../../../agents/smaqit.L2.md
        - id: base-agent-template
          source: ../../../../templates/agents/base-agent.template.md
        - id: base-rules
          source: ../../../../templates/agents/compiled/base.rules.md
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/agents/qa-helper.md"
        operator: exists
      - id: compiled-claude-agent-written
        type: file
        actual: "file:.claude/agents/qa-helper.md"
        operator: exists
      - id: compiled-codex-agent-written
        type: file
        actual: "file:.codex/agents/qa-helper.toml"
        operator: exists
      - id: no-unresolved-placeholders
        type: command
        actual: submission
        command:
          executable: sh
          arguments: ["-c", "! grep -qE '\\[(DOMAIN|PREFIX|PHASE)\\]' .claude/agents/qa-helper.md 2>/dev/null && ! grep -qE '\\[(DOMAIN|PREFIX|PHASE)\\]' .codex/agents/qa-helper.toml 2>/dev/null"]
      - id: has-must-section
        type: text
        actual: "file:.claude/agents/qa-helper.md"
        operator: contains
        value: "MUST"
      - id: has-must-not-section
        type: text
        actual: "file:.claude/agents/qa-helper.md"
        operator: contains
        value: "MUST NOT"
  - id: reject-unresolved-placeholders
    given:
      prompt:
        file: prompts/reject-unresolved-placeholders.md
      files:
        - id: l2agent
          source: ../../../../agents/smaqit.L2.md
        - id: base-agent-template
          source: ../../../../templates/agents/base-agent.template.md
        - id: base-rules
          source: ../../../../templates/agents/compiled/base.rules.md
    expect:
      - id: no-placeholder-file-written
        type: command
        actual: submission
        command:
          executable: sh
          arguments: ["-c", "! grep -qE '\\[(DOMAIN|PREFIX|PHASE)\\]' .claude/agents/incomplete-agent.md 2>/dev/null && ! grep -qE '\\[(DOMAIN|PREFIX|PHASE)\\]' .codex/agents/incomplete-agent.toml 2>/dev/null"]
variants:
  - id: with-artifact
    adapter: process
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
  - id: without-artifact
    adapter: process
    setup:
      - executable: chmod
        arguments: ["-R", "u+w", "{inputRoot}"]
      - executable: rm
        arguments: ["-rf", "{input:l2agent}", "{input:base-agent-template}", "{input:base-rules}"]
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
    intendedDifferences:
      - Removes L2's body, base-agent template, and base rules from the declared inputs before the harness runs, establishing the no-artifact baseline.
execution:
  repetitions: 1
  timeoutSeconds: 600
comparison:
  minimumRequiredPassRate: 1
output:
  directory: ../../runs/agents-l2
