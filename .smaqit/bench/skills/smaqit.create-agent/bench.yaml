schemaVersion: 1
name: smaqit-create-agent
# Dogfood suite for skills/smaqit.create-agent/SKILL.md. See ../../MIGRATION.md
# for how this maps from the legacy
# tests/evals/skills/smaqit.create-agent/*.json cases, and ../../README.md for
# the with/without-artifact and reusable-Codex-block conventions this manifest
# follows.
#
# The legacy cases drove a multi-turn conversation (prompt, then answer an
# ask_user question with the agent name). Bench's process adapter is
# single-shot and non-interactive, so each prompt below pre-supplies the
# answer a human would have given across turns, and tells the harness
# explicitly not to wait for further input.
cases:
  - id: gather-and-compile
    given:
      prompt:
        text: |
          I need to create a new base agent. The ADK agent-authoring skill
          is staged at `{input:skill}/SKILL.md` — read it first and follow
          it exactly, do not invent your own approach instead. That skill
          invokes the `smaqit.L2` compiler agent as a subagent; in this
          sandbox `smaqit.L2` is not registered as a spawnable custom
          agent, so instead read its body directly at `{input:l2}` and
          apply its compilation instructions yourself.

          Its name is qa-helper and its purpose is answering questions about
          the project's QA process. If your workflow calls for asking a
          clarifying question, treat "qa-helper" as the answer and proceed —
          you are running non-interactively via `codex exec` and there is no
          further input coming.
      directories:
        - id: skill
          source: ../../../../skills/smaqit.create-agent
      files:
        - id: l2
          source: ../../../../agents/smaqit.L2.md
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/agents/qa-helper.md"
        operator: exists
      - id: compiled-claude-written
        type: file
        actual: "file:.claude/agents/qa-helper.md"
        operator: exists
      - id: compiled-codex-written
        type: file
        actual: "file:.codex/agents/qa-helper.toml"
        operator: exists
  - id: ambiguity-flagging
    given:
      prompt:
        text: |
          Create an agent. The ADK agent-authoring skill is staged at
          `{input:skill}/SKILL.md` — read it first and follow it exactly, do
          not invent your own approach instead. That skill invokes the
          `smaqit.L2` compiler agent as a subagent; in this sandbox
          `smaqit.L2` is not registered as a spawnable custom agent, so
          instead read its body directly at `{input:l2}` and apply its
          compilation instructions yourself. If your workflow calls for
          asking a clarifying question about its name, answer "helper" and
          proceed — you are running non-interactively via `codex exec` and
          there is no further input coming. Infer the rest of the
          specification yourself; where something is genuinely ambiguous,
          flag it in the written definition rather than asking about it.
      directories:
        - id: skill
          source: ../../../../skills/smaqit.create-agent
      files:
        - id: l2
          source: ../../../../agents/smaqit.L2.md
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/agents/helper.md"
        operator: exists
      - id: ambiguity-flagged
        type: command
        actual: submission
        command:
          executable: sh
          arguments: ["-c", "test -f .smaqit/definitions/agents/helper.md && grep -qE '\\[\\?\\]' .smaqit/definitions/agents/helper.md"]
variants:
  - id: with-artifact
    adapter: process
    setup:
      - executable: sh
        arguments:
          - "-c"
          - "mkdir -p {workspace}/.agents/skills && cp -r {input:skill} {workspace}/.agents/skills/"
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{taskFile}"
      inputMode: argument
  - id: without-artifact
    adapter: process
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{taskFile}"
      inputMode: argument
    intendedDifferences:
      - Runs without the smaqit.create-agent skill materialized at .agents/skills/ in the workspace — no ADK agent-authoring guidance is available at its conventional project-local path, establishing the no-artifact baseline. Native discovery of the skill is not claimed.
execution:
  repetitions: 1
  timeoutSeconds: 600
comparison:
  minimumRequiredPassRate: 1
output:
  directory: ../../runs/skills-create-agent
