schemaVersion: 2
name: smaqit-create-agent
# Dogfood suite for skills/smaqit.create-agent/SKILL.md. See ../../MIGRATION.md
# for how this maps from the legacy
# tests/evals/skills/smaqit.create-agent/*.json cases, and ../../README.md for
# the with/without-artifact and reusable-Codex-block conventions this manifest
# follows.
#
# The legacy cases drove a multi-turn conversation (prompt, then answer an
# ask_user question with the agent name). Bench's process adapter is
# single-shot and non-interactive, so each prompt below pre-supplies the
# answer a human would have given across turns, and tells the harness
# explicitly not to wait for further input.
cases:
  - id: gather-and-compile
    given:
      prompt:
        text: |
          I need to create a new base agent. If the path listed for declared
          input `skill` exists, read its SKILL.md first and follow it exactly
          — do not invent your own approach instead. The skill directs you to
          invoke smaqit.L2, but L2 is intentionally not registered in this
          isolated Bench workspace: if the path listed for declared input
          `l2agent` exists, read its instructions and apply them inline. Use
          the paths listed for `base-agent-template` and `base-rules` instead
          of a global ADK installation. Its name is qa-helper and its purpose
          is answering questions about the project's QA process. If your
          workflow calls for asking a clarifying question, treat "qa-helper"
          as the answer and proceed — you are running non-interactively via
          `codex exec` and there is no further input coming.
      directories:
        - id: skill
          source: ../../../../skills/smaqit.create-agent
      files:
        - id: l2agent
          source: ../../../../agents/smaqit.L2.md
        - id: base-agent-template
          source: ../../../../templates/agents/base-agent.template.md
        - id: base-rules
          source: ../../../../templates/agents/compiled/base.rules.md
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/agents/qa-helper.md"
        operator: exists
      - id: compiled-claude-agent-written
        type: file
        actual: "file:.claude/agents/qa-helper.md"
        operator: exists
      - id: compiled-codex-agent-written
        type: file
        actual: "file:.codex/agents/qa-helper.toml"
        operator: exists
  - id: ambiguity-flagging
    given:
      prompt:
        text: |
          Create an agent. If the path listed for declared input `skill`
          exists, read its SKILL.md first and follow it exactly — do not
          invent your own approach instead. The skill directs you to invoke
          smaqit.L2, but L2 is intentionally not registered in this isolated
          Bench workspace: if the path listed for declared input `l2agent`
          exists, read its instructions and apply them inline. Use the paths
          listed for `base-agent-template` and `base-rules` instead of a
          global ADK installation. If your workflow calls for asking a
          clarifying question about its name, answer "helper" and proceed —
          you are running non-interactively via `codex exec` and there is no
          further input coming. Infer the rest of the specification yourself;
          where something is genuinely ambiguous, flag it in the written
          definition rather than asking about it.
      directories:
        - id: skill
          source: ../../../../skills/smaqit.create-agent
      files:
        - id: l2agent
          source: ../../../../agents/smaqit.L2.md
        - id: base-agent-template
          source: ../../../../templates/agents/base-agent.template.md
        - id: base-rules
          source: ../../../../templates/agents/compiled/base.rules.md
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/agents/helper.md"
        operator: exists
      - id: ambiguity-flagged
        type: command
        actual: submission
        command:
          executable: sh
          arguments: ["-c", "test -f .smaqit/definitions/agents/helper.md && grep -qE '\\[\\?\\]' .smaqit/definitions/agents/helper.md"]
variants:
  - id: with-artifact
    adapter: process
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
  - id: without-artifact
    adapter: process
    setup:
      - executable: chmod
        arguments: ["-R", "u+w", "{inputRoot}"]
      - executable: rm
        arguments: ["-rf", "{input:skill}", "{input:l2agent}", "{input:base-agent-template}", "{input:base-rules}"]
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
    intendedDifferences:
      - Removes the routing skill, L2 body, base-agent template, and base rules from declared inputs before the harness runs, establishing the no-artifact baseline.
execution:
  repetitions: 1
  timeoutSeconds: 600
comparison:
  minimumRequiredPassRate: 1
output:
  directory: ../../runs/skills-create-agent
