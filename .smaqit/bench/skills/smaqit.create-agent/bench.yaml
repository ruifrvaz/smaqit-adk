schemaVersion: 1
name: smaqit-create-agent
# Dogfood suite for skills/smaqit.create-agent/SKILL.md. See ../../MIGRATION.md
# for how this maps from the legacy
# tests/evals/skills/smaqit.create-agent/*.json cases, and ../../README.md for
# the with/without-artifact and reusable-Codex-block conventions this manifest
# follows.
#
# The legacy cases drove a multi-turn conversation (prompt, then answer an
# ask_user question with the agent name). Bench's process adapter is
# single-shot and non-interactive, so each prompt below pre-supplies the
# answer a human would have given across turns, and tells the harness
# explicitly not to wait for further input.
cases:
  - id: gather-and-compile
    given:
      prompt:
        text: |
          I need to create a new base agent. If this project has an ADK
          agent-authoring skill staged at
          .github/skills/smaqit.create-agent/SKILL.md, read it first and
          follow it exactly — do not invent your own approach instead. Its
          name is qa-helper and its purpose is answering questions about the
          project's QA process. If your workflow calls for asking a
          clarifying question, treat "qa-helper" as the answer and proceed —
          you are running non-interactively via `codex exec` and there is no
          further input coming.
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/agents/qa-helper.md"
        operator: exists
      - id: compiled-agent-written
        type: file
        actual: "file:.github/agents/qa-helper.agent.md"
        operator: exists
  - id: ambiguity-flagging
    given:
      prompt:
        text: |
          Create an agent. If this project has an ADK agent-authoring skill
          staged at .github/skills/smaqit.create-agent/SKILL.md, read it
          first and follow it exactly — do not invent your own approach
          instead. If your workflow calls for asking a clarifying question
          about its name, answer "helper" and proceed — you are running
          non-interactively via `codex exec` and there is no further input
          coming. Infer the rest of the specification yourself; where
          something is genuinely ambiguous, flag it in the written definition
          rather than asking about it.
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/agents/helper.md"
        operator: exists
      - id: ambiguity-flagged
        type: command
        actual: submission
        command:
          executable: sh
          arguments: ["-c", "test -f .smaqit/definitions/agents/helper.md && grep -qE '\\[\\?\\]' .smaqit/definitions/agents/helper.md"]
variants:
  - id: with-artifact
    adapter: process
    setup:
      - executable: ../../../../installer/dist/smaqit-adk-dev
        arguments: ["lite", "{workspace}"]
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{taskFile}"
      inputMode: argument
  - id: without-artifact
    adapter: process
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{taskFile}"
      inputMode: argument
    intendedDifferences:
      - Runs without smaqit-adk lite installed — no smaqit.create-agent skill or compilation templates are staged, establishing the no-artifact baseline. Native discovery of the skill is not claimed.
execution:
  repetitions: 1
  timeoutSeconds: 600
comparison:
  minimumRequiredPassRate: 1
output:
  directory: ../../runs/skills-create-agent
