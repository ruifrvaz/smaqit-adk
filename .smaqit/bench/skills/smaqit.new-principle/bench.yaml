schemaVersion: 2
name: smaqit-new-principle
# Dogfood suite for skills/smaqit.new-principle/SKILL.md, scaffolded via
# smaqit.bench-scaffold as the Task 028 live demonstration. See
# ../../README.md for the reusable-Codex-block convention and the
# declarative fixture/treatment staging pattern this manifest
# follows.
#
# smaqit.new-principle delegates entirely to the smaqit.L0 agent, which
# edits framework/*.md files in place. The fixture materializes the same
# writable framework tree for every variant; only the with-artifact variant
# receives the skill and L0 guidance as read-only treatments.
cases:
  - id: add-principle
    fixture:
      source: ../../../../framework
      destination: framework
    given:
      prompt:
        file: prompts/add-principle.md
    expect:
      - id: principle-added
        type: command
        actual: submission
        command:
          executable: sh
          arguments: ["-c", "grep -rl 'Fail Fast:' framework/*.md"]
variants:
  - id: with-artifact
    adapter: process
    treatment:
      - id: skill
        source: ../../../../skills/smaqit.new-principle
      - id: l0agent
        source: ../../../../agents/smaqit.L0.md
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
    intendedDifferences:
      - Exposes the principle-routing skill and L0 body as the variant treatment.
  - id: without-artifact
    adapter: process
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
    intendedDifferences:
      - Uses the same writable framework fixture with an explicitly empty treatment set, establishing the no-artifact baseline.
execution:
  repetitions: 1
  timeoutSeconds: 600
comparison:
  minimumRequiredPassRate: 1
output:
  directory: ../../runs/skills-new-principle
