schemaVersion: 1
name: smaqit-create-skill
# Dogfood suite for skills/smaqit.create-skill/SKILL.md. See ../../MIGRATION.md
# for how this maps from the legacy
# tests/evals/skills/smaqit.create-skill/*.json cases (both 001 and the
# mislabeled 002, whose real content is folded into this single case — see
# MIGRATION.md), and ../../README.md for the with/without-artifact and
# reusable-Codex-block conventions this manifest follows.
cases:
  - id: gather-compile-validate
    given:
      prompt:
        text: |
          I need to create a new skill for adding framework principles to the
          ADK. The ADK skill-authoring skill is staged at
          `{input:skill}/SKILL.md` — read it first and follow it exactly, do
          not use your own built-in skill-authoring tooling instead. That
          skill invokes the `smaqit.L2` compiler agent as a subagent; in
          this sandbox `smaqit.L2` is not registered as a spawnable custom
          agent, so instead read its body directly at `{input:l2}` and
          apply its compilation instructions yourself. The skill's
          validation step will be performed by an external grader, so focus
          on writing the definition and compiling the skill. If your
          workflow calls for asking a clarifying question about its name,
          answer "smaqit.new-principle" and proceed — you are running
          non-interactively via `codex exec` and there is no further input
          coming.
      directories:
        - id: skill
          source: ../../../../skills/smaqit.create-skill
      files:
        - id: l2
          source: ../../../../agents/smaqit.L2.md
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/skills/smaqit.new-principle.md"
        operator: exists
      - id: compiled-skill-written
        type: file
        actual: "file:.agents/skills/smaqit.new-principle/SKILL.md"
        operator: exists
      - id: compiled-skill-claude-written
        type: file
        actual: "file:.claude/skills/smaqit.new-principle/SKILL.md"
        operator: exists
      - id: validator-passes
        type: command
        actual: submission
        command:
          # Pre-built by `make build` (installer/Makefile) rather than `go
          # run`: on a Snap-packaged Go toolchain, `go run` resolves through
          # /snap/bin/go -> /usr/bin/snap, and Bench's process-group
          # isolation for reliable timeout/kill handling triggers Snap's own
          # confinement locking ("race condition detected, snap-run can only
          # retry once"). A plain compiled binary needs no environment at all
          # and sidesteps Snap entirely. See .smaqit/bench/README.md.
          executable: ../../../../installer/dist/validate-skill
          arguments: ["./.claude/skills/smaqit.new-principle/SKILL.md"]
variants:
  - id: with-artifact
    adapter: process
    setup:
      - executable: sh
        arguments:
          - "-c"
          - "mkdir -p {workspace}/.agents/skills && cp -r {input:skill} {workspace}/.agents/skills/"
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{taskFile}"
      inputMode: argument
  - id: without-artifact
    adapter: process
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{taskFile}"
      inputMode: argument
    intendedDifferences:
      - Runs without the smaqit.create-skill skill materialized at .agents/skills/ in the workspace — no ADK skill-authoring guidance is available at its conventional project-local path, establishing the no-artifact baseline. Native discovery of the skill is not claimed.
execution:
  repetitions: 1
  timeoutSeconds: 600
comparison:
  minimumRequiredPassRate: 1
output:
  directory: ../../runs/skills-create-skill
