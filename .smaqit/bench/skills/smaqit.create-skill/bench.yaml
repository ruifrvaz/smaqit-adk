schemaVersion: 2
name: smaqit-create-skill
# Dogfood suite for skills/smaqit.create-skill/SKILL.md. See ../../MIGRATION.md
# for how this maps from the legacy
# tests/evals/skills/smaqit.create-skill/*.json cases (both 001 and the
# mislabeled 002, whose real content is folded into this single case — see
# MIGRATION.md), and ../../README.md for the with/without-artifact and
# reusable-Codex-block conventions this manifest follows.
cases:
  - id: gather-compile-validate
    given:
      prompt:
        text: |
          I need to create a new skill for adding framework principles to the
          ADK. If the Case brief lists a variant treatment named `skill`, read
          its SKILL.md first and follow it exactly — do not use your own built-in
          skill-authoring tooling instead. The skill directs you to invoke
          smaqit.L2, but L2 is intentionally not registered in this isolated
          Bench workspace: if the treatment table lists `l2agent`, read its
          instructions and apply them inline. Use the treatment paths listed
          for `base-skill-template` and `skill-rules` as authoritative. If
          validation is required, the source is under the `skill` treatment
          directory's `scripts/` subdirectory. If the treatment set is empty,
          proceed without ADK guidance and do not search project-global or
          user-global ADK paths.
          If your workflow calls for asking a clarifying question about its
          name, answer "smaqit.new-principle" and proceed — you are running
          non-interactively via `codex exec` and there is no further input
          coming.
    expect:
      - id: definition-written
        type: file
        actual: "file:.smaqit/definitions/skills/smaqit.new-principle.md"
        operator: exists
      - id: compiled-shared-skill-written
        type: file
        actual: "file:.agents/skills/smaqit.new-principle/SKILL.md"
        operator: exists
      - id: compiled-claude-skill-written
        type: file
        actual: "file:.claude/skills/smaqit.new-principle/SKILL.md"
        operator: exists
      - id: compiled-skill-copies-match
        type: command
        actual: submission
        command:
          executable: cmp
          arguments: ["-s", ".agents/skills/smaqit.new-principle/SKILL.md", ".claude/skills/smaqit.new-principle/SKILL.md"]
      - id: validator-passes
        type: command
        actual: submission
        command:
          # Pre-built by `make build` (installer/Makefile) rather than `go
          # run`: on a Snap-packaged Go toolchain, `go run` resolves through
          # /snap/bin/go -> /usr/bin/snap, and Bench's process-group
          # isolation for reliable timeout/kill handling triggers Snap's own
          # confinement locking ("race condition detected, snap-run can only
          # retry once"). A plain compiled binary needs no environment at all
          # and sidesteps Snap entirely. See .smaqit/bench/README.md.
          executable: ../../../../installer/dist/validate-skill
          arguments: ["./.claude/skills/smaqit.new-principle/SKILL.md"]
variants:
  - id: with-artifact
    adapter: process
    treatment:
      - id: skill
        source: ../../../../skills/smaqit.create-skill
      - id: l2agent
        source: ../../../../agents/smaqit.L2.md
      - id: base-skill-template
        source: ../../../../templates/skills/base-skill.template.md
      - id: skill-rules
        source: ../../../../templates/skills/compiled/skill.rules.md
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
    intendedDifferences:
      - Exposes the routing skill, L2 body, base-skill template, and skill rules as the variant treatment.
  - id: without-artifact
    adapter: process
    process:
      executable: codex
      arguments:
        - exec
        - --sandbox
        - danger-full-access
        - --skip-git-repo-check
        - --cd
        - "{workspace}"
        - "{briefFile}"
      inputMode: argument
    intendedDifferences:
      - Uses an explicitly empty treatment set, establishing the no-artifact baseline.
execution:
  repetitions: 1
  timeoutSeconds: 600
comparison:
  minimumRequiredPassRate: 1
output:
  directory: ../../runs/skills-create-skill
